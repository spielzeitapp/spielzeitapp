<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spielzeit Manager installieren</title>
    <meta name="theme-color" content="#090909" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spielzeit Manager" />
    <link rel="manifest" href="/manifest-manager.json" />
    <link rel="apple-touch-icon" href="/manager-apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      body { min-height: 100dvh; box-sizing: border-box; margin: 0; display: grid; place-items: center; background: #090909; color: #fff; padding: 24px; }
      main { max-width: 400px; text-align: center; }
      img { width: 110px; height: 110px; border-radius: 24px; }
      h1 { font-size: 26px; margin: 20px 0 10px; }
      p { color: #d1d5db; line-height: 1.5; }
      a { display: inline-block; margin-top: 18px; border-radius: 12px; padding: 14px 22px; background: #b91c1c; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
    <script>
      if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
        window.location.replace('/manager?entry=platform');
      }
    </script>
  </head>
  <body>
    <main>
      <img src="/manager-icon-192.png" alt="Spielzeit Manager" />
      <h1>Spielzeit Manager</h1>
      <p>Diese Seite in Safari über <strong>Teilen → Zum Home-Bildschirm</strong> als eigenes Manager-Icon hinzufügen.</p>
      <p>Du verwendest deinen bestehenden SpielzeitApp-Login. Beim ersten Öffnen des neuen Icons kann eine Anmeldung nötig sein.</p>
      <a href="/manager?entry=platform">Manager jetzt öffnen</a>
    </main>
  </body>
</html>
