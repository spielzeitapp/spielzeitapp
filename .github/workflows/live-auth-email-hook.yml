name: Configure LIVE contextual auth email sender
on:
  push:
    branches: [main]
    paths:
      - api/parent/send-invite.js
      - server/lib/authEmailEndpoint.js
      - server/lib/authEmailHook.js
      - server/lib/sendParentInviteEmail.js
      - scripts/live-auth-email-hook.mjs
      - .github/workflows/live-auth-email-hook.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-auth-email-hook
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Verify signatures and project isolation
        run: node scripts/auth-email-hook-test.mjs
      - name: Verify LIVE transport before changing mail configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/live-auth-email-hook.mjs
