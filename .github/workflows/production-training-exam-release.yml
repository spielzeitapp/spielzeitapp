name: Production training exam release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-training-exam-release.yml"

permissions:
  contents: read

concurrency:
  group: production-training-exam-release
  cancel-in-progress: false

jobs:
  release:
    name: Migrate and deploy training exam features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: shxugattqatahckhspwk
      EXPECTED_PROJECT_NAME: spielzeitapp-nsg
    steps:
      - name: Checkout production
        uses: actions/checkout@v4

      - name: Verify production project and apply migrations
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }

          node <<'NODE'
          const fs = require('node:fs');

          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const expectedName = process.env.EXPECTED_PROJECT_NAME;
          const base = 'https://api.supabase.com/v1';
          const files = [
            'supabase/migrations/20260824210000_training_exam_documentations.sql',
            'supabase/migrations/20260824223000_training_exam_editable_pdf_fields.sql',
            'supabase/migrations/20260825120000_training_exam_phase_text_overrides.sql',
            'supabase/migrations/20260825143000_training_exercise_short_texts.sql',
          ];

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${path} failed (${response.status}): ${body.slice(0, 500)}`);
            }
            return body ? JSON.parse(body) : null;
          }

          async function query(sql) {
            return request(`/projects/${ref}/database/query`, {
              method: 'POST',
              body: JSON.stringify({ query: sql }),
            });
          }

          (async () => {
            const project = await request(`/projects/${ref}`);
            if (project.id !== ref || project.name !== expectedName) {
              throw new Error(`Project guard failed: ${project.name} (${project.id})`);
            }

            for (const file of files) {
              await query(fs.readFileSync(file, 'utf8'));
              console.log(`Applied ${file}`);
            }

            const verification = await query(`
              SELECT
                to_regclass('public.training_exam_documentations') IS NOT NULL AS exam_docs,
                to_regclass('public.training_exam_documentation_items') IS NOT NULL AS exam_items,
                EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'training_exercises'
                    AND column_name = 'short_content'
                ) AS short_content,
                EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'training_exam_documentation_items'
                    AND column_name = 'phase_text_overrides'
                ) AS phase_overrides;
            `);
            const row = verification?.[0] || {};
            if (!row.exam_docs || !row.exam_items || !row.short_content || !row.phase_overrides) {
              throw new Error(`Migration verification failed: ${JSON.stringify(row)}`);
            }
            console.log('Production training migrations verified.');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify OpenAI secret
        shell: bash
        run: |
          npx --yes supabase@2.16.0 secrets list --project-ref "$SUPABASE_PROJECT_REF" \
            | grep -q 'OPENAI_API_KEY' || {
                echo "::error::OPENAI_API_KEY is missing in Production Supabase."
                exit 1
              }

      - name: Deploy shortening function
        shell: bash
        run: |
          npx --yes supabase@2.16.0 functions deploy shorten-training-exercise \
            --project-ref "$SUPABASE_PROJECT_REF"
