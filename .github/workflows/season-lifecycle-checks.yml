name: Season lifecycle checks
on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'scripts/season-lifecycle-assistant-test.mjs'
      - 'scripts/central-workspace-test.mjs'
      - 'scripts/central-reference-test.mjs'
      - '.github/workflows/season-lifecycle-checks.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: node scripts/season-lifecycle-assistant-test.mjs
      - run: node scripts/central-workspace-test.mjs
      - run: node scripts/central-reference-test.mjs
      - run: node scripts/team-view-selection-test.mjs
      - run: node scripts/manager-player-fotobox-test.mjs
      - run: node scripts/club-photo-template-test.mjs
      - run: node scripts/manager-comparison-routing-test.mjs
      - run: node scripts/manager-club-appearance-test.mjs
      - run: node scripts/manager-mobile-shell-test.mjs
      - run: npm run build
