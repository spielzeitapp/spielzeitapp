name: Publish approved LIVE version
run-name: LIVE ${{ inputs.head }} · ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      head:
        required: true
        type: string
      main:
        required: true
        type: string
      plan_digest:
        required: true
        type: string
      actor:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: spielzeit-live-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck exact approved snapshot
        run: node scripts/release/publish-live.mjs verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_HEAD: ${{ inputs.head }}
          RELEASE_MAIN: ${{ inputs.main }}
          RELEASE_PLAN_DIGEST: ${{ inputs.plan_digest }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head }}
          path: candidate
          persist-credentials: false
      - name: Verify candidate build and release guards
        working-directory: candidate
        run: |
          npm ci
          npm run typecheck
          node --test scripts/release/live-release.test.cjs
          npm run build
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed database changes and promote exact commit
        run: node scripts/release/publish-live.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_HEAD: ${{ inputs.head }}
          RELEASE_MAIN: ${{ inputs.main }}
          RELEASE_PLAN_DIGEST: ${{ inputs.plan_digest }}
          RELEASE_ACTOR: ${{ inputs.actor }}
          RELEASE_REQUEST_ID: ${{ inputs.request_id }}
      - name: Confirm public LIVE version
        run: node scripts/release/publish-live.mjs monitor
        env:
          RELEASE_HEAD: ${{ inputs.head }}
          RELEASE_MAIN: ${{ inputs.main }}
          RELEASE_PLAN_DIGEST: ${{ inputs.plan_digest }}
