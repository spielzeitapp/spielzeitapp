name: Match squad publication

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/match-squad-publication.yml"
      - "supabase/migrations/20260916143000_match_squad_publication.sql"
      - "supabase/migrations/20260916173000_match_squad_custom_messages.sql"
      - "supabase/migrations/20260917183000_atomic_match_squad_save.sql"
      - "supabase/migrations/20260918100000_notification_jobs_allow_squad_jobs.sql"
      - "supabase/migrations/20260918104500_drop_legacy_notification_jobs_unique_index.sql"
      - "supabase/functions/send-reminders/index.ts"

permissions:
  contents: read

concurrency:
  group: match-squad-publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Apply squad publication and deploy notifications
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_VERSION: "20260918104500"
      MIGRATION_FILE: supabase/migrations/20260918104500_drop_legacy_notification_jobs_unique_index.sql
    steps:
      - uses: actions/checkout@v4

      - name: Select guarded target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "SUPABASE_PROJECT_REF=acbaecjzoabafbsjrzvr" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-staging" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "SUPABASE_PROJECT_REF=shxugattqatahckhspwk" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-nsg" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Verify target, apply and validate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const expectedName = process.env.EXPECTED_PROJECT_NAME;
          const version = process.env.MIGRATION_VERSION;
          const base = 'https://api.supabase.com/v1';

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed (${response.status}): ${body}`);
            return body ? JSON.parse(body) : null;
          }
          async function query(sql) {
            return request(`/projects/${ref}/database/query`, {
              method: 'POST',
              body: JSON.stringify({ query: sql }),
            });
          }

          (async () => {
            const project = await request(`/projects/${ref}`);
            if (project.id !== ref || project.name !== expectedName) {
              throw new Error(`Project guard failed: ${project.name} (${project.id})`);
            }
            const migration = fs.readFileSync(process.env.MIGRATION_FILE, 'utf8');
            await query(`${migration}\nINSERT INTO supabase_migrations.schema_migrations (version) VALUES ('${version}') ON CONFLICT DO NOTHING;`);
            const result = await query(`
              SELECT
                to_regclass('public.match_squad_publications') IS NOT NULL AS publication_table,
                to_regprocedure('public.publish_match_squad(uuid)') IS NOT NULL AS publish_rpc,
                to_regprocedure('public.publish_match_squad(uuid,text,text)') IS NOT NULL AS custom_message_rpc,
                to_regprocedure('public.save_match_squad_only(uuid,uuid[])') IS NOT NULL AS atomic_squad_save_rpc,
                NOT EXISTS (
                  SELECT 1
                  FROM pg_constraint
                  WHERE conrelid = 'public.notification_jobs'::regclass
                    AND conname = 'notification_jobs_unique'
                ) AS legacy_job_constraint_removed,
                to_regclass('public.notification_jobs_unique') IS NULL AS legacy_job_index_removed,
                to_regclass('public.idx_notification_jobs_dedupe_key_unique') IS NOT NULL AS dedupe_index_present,
                EXISTS (
                  SELECT 1 FROM pg_class
                  WHERE oid = 'public.match_squad_publications'::regclass AND relrowsecurity
                ) AS rls_enabled,
                EXISTS (
                  SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '${version}'
                ) AS migration_recorded;
            `);
            const check = result?.[0];
            if (!check || Object.values(check).some((value) => value !== true)) {
              throw new Error('Squad publication verification failed.');
            }
            console.log(`MATCH_SQUAD_PUBLICATION_OK (${expectedName})`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Deploy reminder worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.106.0 functions deploy send-reminders \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
