name: Carpool driver acceptance

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/carpool-driver-acceptance.yml"
      - "supabase/migrations/20260919204500_carpool_driver_acceptance.sql"
      - "supabase/migrations/20260919215500_carpool_driver_display_name.sql"
      - "supabase/migrations/20260920123000_carpool_pickup_messages_and_reminders.sql"
      - "supabase/migrations/20260920151500_carpool_pickup_confirmation.sql"

permissions:
  contents: read

concurrency:
  group: carpool-driver-acceptance-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify carpool driver acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_VERSION: "20260920151500"
      MIGRATION_FILE: supabase/migrations/20260920151500_carpool_pickup_confirmation.sql
    steps:
      - uses: actions/checkout@v4

      - name: Select guarded target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "SUPABASE_PROJECT_REF=acbaecjzoabafbsjrzvr" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-staging" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "SUPABASE_PROJECT_REF=shxugattqatahckhspwk" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-nsg" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Apply and verify migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const expectedName = process.env.EXPECTED_PROJECT_NAME;
          const version = process.env.MIGRATION_VERSION;
          const base = 'https://api.supabase.com/v1';

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed (${response.status}): ${body}`);
            return body ? JSON.parse(body) : null;
          }

          async function query(sql) {
            return request(`/projects/${ref}/database/query`, {
              method: 'POST',
              body: JSON.stringify({ query: sql }),
            });
          }

          (async () => {
            const project = await request(`/projects/${ref}`);
            if (project.id !== ref || project.name !== expectedName) {
              throw new Error(`Project guard failed: ${project.name} (${project.id})`);
            }

            const migration = fs.readFileSync(process.env.MIGRATION_FILE, 'utf8');
            await query(`${migration}\nINSERT INTO supabase_migrations.schema_migrations (version) VALUES ('${version}') ON CONFLICT DO NOTHING;`);

            const result = await query(`
              SELECT
                to_regclass('public.event_carpool_pickup_details') IS NOT NULL AS pickup_table,
                to_regprocedure('public.confirm_event_carpool_pickup(uuid)') IS NOT NULL AS confirmation_rpc,
                EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_schema = 'public'
                    AND table_name = 'event_carpool_pickup_details'
                    AND column_name = 'confirmed_at'
                ) AS confirmation_column,
                EXISTS (
                  SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '${version}'
                ) AS migration_recorded;
            `);
            if (!result?.[0]?.pickup_table || !result?.[0]?.confirmation_rpc ||
                !result?.[0]?.confirmation_column ||
                !result?.[0]?.migration_recorded) {
              throw new Error('Carpool pickup confirmation verification failed.');
            }
            console.log(`CARPOOL_PICKUP_CONFIRMATION_OK (${expectedName})`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
