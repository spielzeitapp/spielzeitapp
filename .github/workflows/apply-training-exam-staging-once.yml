name: Apply trainer exam migration to staging (one time)

on:
  push:
    branches:
      - ops/apply-training-exam-staging-20260824
    paths:
      - .github/workflows/apply-training-exam-staging-once.yml

permissions:
  contents: read

jobs:
  migrate:
    name: Apply only 20260824210000 to spielzeitapp-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Confirm configured access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not available as a repository secret."
            exit 1
          fi

      - name: Apply exact migration through Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: acbaecjzoabafbsjrzvr
          MIGRATION_FILE: supabase/migrations/20260824210000_training_exam_documentations.sql
        run: |
          jq -n --rawfile query "$MIGRATION_FILE" '{query: $query}' > migration-request.json
          status="$(curl --silent --show-error --output migration-response.json --write-out '%{http_code}' \
            --request POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data @migration-request.json)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Migration request failed with HTTP $status."
            jq -r '.message // .error // "Unknown Supabase error"' migration-response.json
            exit 1
          fi
          echo "Migration SQL applied to staging project $PROJECT_REF."

      - name: Verify tables and RLS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: acbaecjzoabafbsjrzvr
        run: |
          cat > verify.sql <<'SQL'
          SELECT
            to_regclass('public.training_exam_documentations')::text AS documentations_table,
            to_regclass('public.training_exam_documentation_items')::text AS items_table,
            (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.training_exam_documentations'::regclass) AS documentations_rls,
            (SELECT relrowsecurity FROM pg_class WHERE oid = 'public.training_exam_documentation_items'::regclass) AS items_rls,
            (SELECT count(*) FROM pg_policies WHERE schemaname = 'public' AND tablename IN ('training_exam_documentations', 'training_exam_documentation_items')) AS policy_count;
          SQL
          jq -n --rawfile query verify.sql '{query: $query}' > verify-request.json
          status="$(curl --silent --show-error --output verify-response.json --write-out '%{http_code}' \
            --request POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data @verify-request.json)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Verification request failed with HTTP $status."
            jq -r '.message // .error // "Unknown Supabase error"' verify-response.json
            exit 1
          fi
          jq -e '.[0].documentations_table == "training_exam_documentations"
            and .[0].items_table == "training_exam_documentation_items"
            and .[0].documentations_rls == true
            and .[0].items_rls == true
            and (.[0].policy_count | tonumber) == 8' verify-response.json >/dev/null
          echo "Verified both tables, RLS enabled, and 8 policies."
