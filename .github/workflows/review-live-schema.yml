name: Review schema for Manager approval
run-name: ${{ inputs.mode == 'approve' && 'SCHEMA-APPROVAL' || 'SCHEMA' }} ${{ inputs.head }} ${{ inputs.main }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      mode: {required: true, type: choice, default: check, options: [check, approve]}
      review_run_id: {required: false, type: string}
      actor: {required: false, type: string}
      head: {required: true, type: string}
      main: {required: true, type: string}
      plan_digest: {required: true, type: string}
      request_id: {required: true, type: string}
permissions:
  contents: read
  actions: read
  statuses: read
concurrency:
  group: manager-schema-review
  cancel-in-progress: false
env:
  RELEASE_HEAD: ${{ inputs.head }}
  RELEASE_MAIN: ${{ inputs.main }}
  RELEASE_PLAN_DIGEST: ${{ inputs.plan_digest }}
jobs:
  prepare:
    if: inputs.mode == 'check' && github.ref == 'refs/heads/main' && github.sha == inputs.main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.main }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Read schema metadata and pinned SQL only
        run: node scripts/release/review-live-schema.mjs prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-review-input
          path: review-work/bundle.json
          retention-days: 1
  check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.main }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: schema-review-input
          path: review-work
      - name: Install isolated parser and database engine
        run: |
          python -m pip install pglast==7.22
          python scripts/release/review-sql-test.py
          npm install --prefix /tmp/schema-review --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Check supported SQL in isolated database without LIVE credentials
        run: node scripts/release/review-live-schema.mjs check
        env:
          PGLITE_MODULE: /tmp/schema-review/node_modules/@electric-sql/pglite/dist/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: technical-review
          path: review-result/report.json
          retention-days: 1
  approve:
    if: inputs.mode == 'approve' && github.ref == 'refs/heads/main' && github.sha == inputs.main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.main }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm install --prefix /tmp/schema-review-deps --ignore-scripts fflate@0.8.3
      - name: Verify report again and record exact approvals on develop
        run: node scripts/release/review-live-schema.mjs approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_PATH: /tmp/schema-review-deps/node_modules
          REVIEW_RUN_ID: ${{ inputs.review_run_id }}
          REVIEW_ACTOR: ${{ inputs.actor }}
