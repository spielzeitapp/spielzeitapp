name: Staging trainer exam PDF unit selection

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/staging-training-exam-unit-selection.yml"
      - "supabase/migrations/20260905100000_training_exam_pdf_unit_selection.sql"

permissions:
  contents: read

concurrency:
  group: staging-training-exam-unit-selection
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply trainer exam PDF selection to staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: acbaecjzoabafbsjrzvr
      EXPECTED_PROJECT_NAME: spielzeitapp-staging
      MIGRATION_FILE: supabase/migrations/20260905100000_training_exam_pdf_unit_selection.sql
    steps:
      - uses: actions/checkout@v4

      - name: Verify staging, apply and validate
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }

          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const expectedName = process.env.EXPECTED_PROJECT_NAME;
          const base = 'https://api.supabase.com/v1';

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed (${response.status})`);
            return body ? JSON.parse(body) : null;
          }

          async function query(sql) {
            return request(`/projects/${ref}/database/query`, {
              method: 'POST',
              body: JSON.stringify({ query: sql }),
            });
          }

          (async () => {
            const project = await request(`/projects/${ref}`);
            if (project.id !== ref || project.name !== expectedName) {
              throw new Error(`Project guard failed: ${project.name} (${project.id})`);
            }
            await query(fs.readFileSync(process.env.MIGRATION_FILE, 'utf8'));
            const result = await query(`
              SELECT EXISTS (
                SELECT 1
                FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'training_exam_documentation_items'
                  AND column_name = 'included_in_pdf'
                  AND data_type = 'boolean'
              ) AS selection_column_ready;
            `);
            if (result?.[0]?.selection_column_ready !== true) {
              throw new Error('Trainer exam PDF selection column verification failed.');
            }
            console.log('STAGING_TRAINER_EXAM_SELECTION_OK');
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
