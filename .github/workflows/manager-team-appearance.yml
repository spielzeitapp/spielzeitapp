name: Manager team appearance
on:
  push:
    branches: [develop, main]
    paths:
      - "supabase/migrations/20261121080947_manager_team_appearance.sql"
      - ".github/workflows/manager-team-appearance.yml"
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply and verify team branding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const targets = {
            develop: ['acbaecjzoabafbsjrzvr', 'spielzeitapp-staging'],
            main: ['shxugattqatahckhspwk', 'spielzeitapp-nsg'],
          };
          const [ref, name] = targets[process.env.GITHUB_REF_NAME] ?? [];
          if (!ref || !process.env.SUPABASE_ACCESS_TOKEN) throw new Error('Missing migration target or token');
          const path = 'supabase/migrations/20261121080947_manager_team_appearance.sql';
          const plan = JSON.parse(fs.readFileSync('release/live-plan.json', 'utf8'));
          if (execFileSync('git', ['hash-object', path], { encoding: 'utf8' }).trim() !== plan.migrations[path]) {
            throw new Error('Migration differs from the reviewed file');
          }
          async function request(suffix, query) {
            const response = await fetch('https://api.supabase.com/v1/projects/' + ref + suffix, {
              method: query ? 'POST' : 'GET',
              headers: {
                Authorization: 'Bearer ' + process.env.SUPABASE_ACCESS_TOKEN,
                'Content-Type': 'application/json',
              },
              body: query ? JSON.stringify({ query }) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error('Supabase request failed: ' + response.status + ' ' + await response.text());
            return response.json();
          }
          (async () => {
            const project = await request('');
            if (project.id !== ref || project.name !== name) throw new Error('Unexpected project');
            const sql = fs.readFileSync(path, 'utf8');
            await request('/database/query', "begin;\n" + sql + "\ninsert into supabase_migrations.schema_migrations(version,name) values ('20261121080947','manager_team_appearance') on conflict (version) do nothing;\ncommit;");
            const [result] = await request('/database/query', "select has_function_privilege('authenticated','public.admin_set_team_branding(uuid,uuid,jsonb)','execute') as can_call, not has_function_privilege('anon','public.admin_set_team_branding(uuid,uuid,jsonb)','execute') as anon_blocked, not has_table_privilege('authenticated','public.team_branding_overrides','insert,update,delete') as auth_read_only, exists(select 1 from storage.buckets where id='team-logos' and public) as logo_bucket");
            if (!result?.can_call || !result?.anon_blocked || !result?.auth_read_only || !result?.logo_bucket) throw new Error('SQL readback failed');
            console.log('Verified team branding in ' + name);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
