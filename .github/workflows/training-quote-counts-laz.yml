name: Training quote counts LAZ

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/training-quote-counts-laz.yml"
      - "supabase/migrations/20260914230000_training_quote_counts_laz.sql"

permissions:
  contents: read

concurrency:
  group: training-quote-counts-laz-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply training quote formula
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_VERSION: "20260914230000"
      MIGRATION_FILE: supabase/migrations/20260914230000_training_quote_counts_laz.sql
    steps:
      - uses: actions/checkout@v4

      - name: Select guarded target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "SUPABASE_PROJECT_REF=acbaecjzoabafbsjrzvr" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-staging" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "SUPABASE_PROJECT_REF=shxugattqatahckhspwk" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-nsg" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Verify target, apply and validate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }

          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const expectedName = process.env.EXPECTED_PROJECT_NAME;
          const version = process.env.MIGRATION_VERSION;
          const base = 'https://api.supabase.com/v1';

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...(options.headers || {}),
              },
            });
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${path} failed (${response.status})`);
            }
            return body ? JSON.parse(body) : null;
          }

          async function query(sql) {
            return request(`/projects/${ref}/database/query`, {
              method: 'POST',
              body: JSON.stringify({ query: sql }),
            });
          }

          (async () => {
            const project = await request(`/projects/${ref}`);
            if (project.id !== ref || project.name !== expectedName) {
              throw new Error(`Project guard failed: ${project.name} (${project.id})`);
            }

            const migration = fs.readFileSync(process.env.MIGRATION_FILE, 'utf8');
            await query(`${migration}\nINSERT INTO supabase_migrations.schema_migrations (version) VALUES ('${version}') ON CONFLICT DO NOTHING;`);

            const result = await query(`
              SELECT
                position('external_training' in pg_get_functiondef(
                  'public.get_team_training_participation_pct(uuid)'::regprocedure
                )) > 0 AS laz_in_formula,
                position('sick' in pg_get_functiondef(
                  'public.get_team_training_participation_pct(uuid)'::regprocedure
                )) > 0
                AND position('injured' in pg_get_functiondef(
                  'public.get_team_training_participation_pct(uuid)'::regprocedure
                )) > 0 AS neutral_statuses_ready,
                EXISTS (
                  SELECT 1
                  FROM supabase_migrations.schema_migrations
                  WHERE version = '${version}'
                ) AS migration_recorded;
            `);

            const check = result?.[0];
            if (!check || Object.values(check).some((value) => value !== true)) {
              throw new Error('Training quote formula verification failed.');
            }
            console.log(`TRAINING_QUOTE_COUNTS_LAZ_OK (${expectedName})`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
