name: Carpool owner delete permissions

on:
  push:
    branches: [develop, main]
    paths:
      - ".github/workflows/carpool-owner-delete-permissions.yml"
      - "supabase/migrations/20260921223000_carpool_owner_delete_permissions.sql"

permissions:
  contents: read

concurrency:
  group: carpool-owner-delete-permissions-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify carpool owner permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MIGRATION_VERSION: "20260921223000"
      MIGRATION_FILE: supabase/migrations/20260921223000_carpool_owner_delete_permissions.sql
    steps:
      - uses: actions/checkout@v4

      - name: Select guarded target
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "SUPABASE_PROJECT_REF=acbaecjzoabafbsjrzvr" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-staging" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "SUPABASE_PROJECT_REF=shxugattqatahckhspwk" >> "$GITHUB_ENV"
            echo "EXPECTED_PROJECT_NAME=spielzeitapp-nsg" >> "$GITHUB_ENV"
          else
            echo "::error::Unsupported branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Apply and verify migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          node <<'NODE'
          const fs = require('node:fs');
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.SUPABASE_PROJECT_REF;
          const expectedName = process.env.EXPECTED_PROJECT_NAME;
          const version = process.env.MIGRATION_VERSION;
          const base = 'https://api.supabase.com/v1';

          async function request(path, options = {}) {
            const response = await fetch(base + path, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed (${response.status}): ${body}`);
            return body ? JSON.parse(body) : null;
          }

          async function query(sql) {
            return request(`/projects/${ref}/database/query`, {
              method: 'POST',
              body: JSON.stringify({ query: sql }),
            });
          }

          (async () => {
            const project = await request(`/projects/${ref}`);
            if (project.id !== ref || project.name !== expectedName) {
              throw new Error(`Project guard failed: ${project.name} (${project.id})`);
            }

            const migration = fs.readFileSync(process.env.MIGRATION_FILE, 'utf8');
            await query(`${migration}\nINSERT INTO supabase_migrations.schema_migrations (version) VALUES ('${version}') ON CONFLICT DO NOTHING;`);

            const result = await query(`
              SELECT
                EXISTS (
                  SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '${version}'
                ) AS migration_recorded,
                (SELECT pg_get_expr(polqual, polrelid)
                   FROM pg_policy
                  WHERE polname = 'event_carpool_offers_delete_own'
                    AND polrelid = 'public.event_carpool_offers'::regclass) AS offer_delete_rule,
                (SELECT pg_get_expr(polqual, polrelid)
                   FROM pg_policy
                  WHERE polname = 'event_carpool_reservations_delete_own_player'
                    AND polrelid = 'public.event_carpool_reservations'::regclass) AS reservation_delete_rule;
            `);
            const row = result?.[0];
            if (!row?.migration_recorded) throw new Error('Migration record verification failed.');
            if (!row.offer_delete_rule?.includes('driver_user_id') || row.offer_delete_rule.includes('carpool_can_manage_event')) {
              throw new Error(`Unexpected offer delete rule: ${row.offer_delete_rule}`);
            }
            if (!row.reservation_delete_rule?.includes('driver_user_id') || row.reservation_delete_rule.includes('carpool_can_manage_event')) {
              throw new Error(`Unexpected reservation delete rule: ${row.reservation_delete_rule}`);
            }
            console.log(`CARPOOL_OWNER_DELETE_PERMISSIONS_OK (${expectedName})`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
