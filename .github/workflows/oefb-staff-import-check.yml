name: Verify OFB trainer import
on:
  push:
    branches: [develop]
    paths:
      - 'server/lib/oefbStaff.js'
      - 'src/manager/ManagerOefbStaffPreview.tsx'
      - '.github/workflows/oefb-staff-import-check.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node scripts/oefb-staff-preview-test.cjs
      - name: Parser and real public trainer page
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const handler=require('./server/lib/oefbStaff.js');
          (async()=>{
            const fixture="SG.container.appPreloads['fixture']="+JSON.stringify([{trainer:[{vorname:'First',nachname:'Coach',funktion:'Trainer',fotoUrl:'https://vereine.oefb.at/netzwerk/imagedownload/portrait.jpg'}]}])+";";
            const parsed=handler.extract(fixture);
            assert.equal(parsed.trainers.length,1);
            assert.equal(parsed.trainers[0].photoUrl,'https://vereine.oefb.at/netzwerk/imagedownload/portrait.jpg');
            const html=await (await fetch('https://vereine.oefb.at/USCRohrbach/Mannschaften/Saison-2026-27/U12-1/Trainer-Betreuer',{signal:AbortSignal.timeout(20000)})).text();
            const result=handler.extract(html);
            console.log('Public trainer count:',result.trainers.length);
            console.log('Public preload field names:',JSON.stringify(result.schemaKeys));
            assert.ok(result.trainers.length>=2,'Expected the public U12 trainers');
            assert.ok(result.trainers.every(t=>t.name&&t.sourceRole));
            console.log('Trainer names and photo availability:',JSON.stringify(result.trainers.map(t=>({name:t.name,photo:!!t.photoUrl}))));
            console.log('Public script paths:',JSON.stringify([...html.matchAll(/<script\b[^>]*src=["']([^"']+)/gi)].map(m=>m[1])));
            for(const m of html.matchAll(/SG\.container\.appPreloads\s*\[[^\]\r\n]+\]\s*=\s*(\[[\s\S]*?\])\s*;/g)){try{const blocks=JSON.parse(m[1]);for(const b of blocks){if(b.images)console.log('Image settings:',JSON.stringify(b.images));}}catch{}}
            const script=(await (await fetch('https://vereine.oefb.at/features/container.js?version=1eQNyblR',{signal:AbortSignal.timeout(20000)})).text());
            for(const term of ['fotoId','imagedownload','vereine3/images','imageUrl','getImage']){const pos=script.indexOf(term);console.log('Image resolver code:',term,pos,pos>=0?script.slice(Math.max(0,pos-160),pos+250):'');}
            console.log('Script dependencies:',JSON.stringify([...script.matchAll(/["']([^"']+\.js[^"']*)["']/g)].map(m=>m[1]).slice(0,15)));
            const ids=[...html.matchAll(/"fotoId"\s*:\s*("[^"]*"|[0-9]+)/g)].map(m=>JSON.parse(m[1]));
            console.log('Staff photo identifiers:',JSON.stringify(ids));
            for(const id of ids){const escaped=String(id).replace(/[.*+?^${}()|[\]\\]/g,'\\            assert.ok(result.trainers.every(t=>t.name&&t.sourceRole));');const matches=[...html.matchAll(new RegExp('[^"\\s<>]*'+escaped+'[^"\\s<>]*','g'))].map(m=>m[0]);console.log('Public photo references:',JSON.stringify(matches.slice(0,8)));}

          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
