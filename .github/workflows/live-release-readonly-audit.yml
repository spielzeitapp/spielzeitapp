name: LIVE release metadata audit (read only)
on:
  push:
    branches: [audit/live-release-metadata]
    paths: [.github/workflows/live-release-readonly-audit.yml]
permissions:
  contents: read
concurrency:
  group: live-release-readonly-metadata-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/audit/live-release-metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read schema metadata and migration fingerprints only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const ref='shxugattqatahckhspwk';
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          if(!token)throw new Error('Existing SUPABASE_ACCESS_TOKEN secret is unavailable');
          async function api(path,body){
            const response=await fetch('https://api.supabase.com/v1'+path,{
              method:body?'POST':'GET',signal:AbortSignal.timeout(45000),
              headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{})
            });
            if(!response.ok)throw new Error(`Supabase metadata request failed (${response.status})`);
            return response.json();
          }
          const project=await api(`/projects/${ref}`);
          if(project.id!==ref||project.name!=='spielzeitapp-nsg')throw new Error('LIVE project guard failed');
          const query=`select jsonb_build_object(
            'project','${ref}',
            'connections',(select jsonb_agg(x) from (select state,wait_event_type,wait_event,count(*) as connections from pg_catalog.pg_stat_activity group by 1,2,3) x),
            'migrations',(select jsonb_agg(x order by x.version) from (select version,name,cardinality(statements) as statement_count,md5(array_to_string(statements,E'\\n')) as statements_md5,md5(btrim(array_to_string(statements,E'\\n'))) as trimmed_md5 from supabase_migrations.schema_migrations) x),
            'columns',(select jsonb_agg(x order by x.table_name,x.ordinal_position) from (select table_name,column_name,data_type,is_nullable,column_default,ordinal_position from information_schema.columns where table_schema='public' and table_name in ('team_seasons','teams','players','player_profiles','team_season_players','matches','events','event_feed_settings','club_admin_assignments','manager_setup_progress','pending_team_staff_invites','club_communication_access','oefb_player_links','oefb_goal_attributions')) x),
            'routines',(select jsonb_agg(x order by x.name,x.arguments) from (select p.proname as name,pg_catalog.pg_get_function_identity_arguments(p.oid) as arguments,p.prosecdef as security_definer,md5(pg_catalog.pg_get_functiondef(p.oid)) as definition_md5 from pg_catalog.pg_proc p join pg_catalog.pg_namespace n on n.oid=p.pronamespace where n.nspname in ('public','oefb_sync') and p.prokind='f') x)
          ) as report`;
          // The entire statement is a static SELECT over metadata catalogs and migration hashes.
          // Do not execute repository migrations, application RPCs, or arbitrary input here.
          if(!/^select\s/i.test(query)||/\b(insert|update|delete|alter|create|drop|grant|revoke|call|do)\s/i.test(query))throw new Error('Read-only query guard failed');
          const rows=await api(`/projects/${ref}/database/query`,{query});
          const report=rows?.[0]?.report;
          if(report?.project!==ref||!Array.isArray(report.migrations))throw new Error('Invalid metadata response');
          console.log('LIVE_RELEASE_METADATA_START');
          console.log(JSON.stringify(report));
          console.log('LIVE_RELEASE_METADATA_END');
          NODE
